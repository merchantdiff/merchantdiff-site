name: Update Shopify changelog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shopify-changelog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Shopify updates page
        run: python scripts/update_shopify.py

      - name: Commit changes if Shopify changed
        run: |
          git add updates.html

          if git diff --cached --quiet; then
            echo "No Shopify changelog changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Shopify changelog"
          git push
