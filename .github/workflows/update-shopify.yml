name: Update Shopify changelog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shopify-changelog
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Shopify updates page
        run: python scripts/update_shopify.py

      - name: Check for changes
        id: changes
        run: |
          git add updates.html

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Shopify changelog changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Shopify changelog changed."
          fi

      - name: Commit updated page
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Shopify changelog"
          git push

      - name: Wait for GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        run: sleep 60

      - name: Notify IndexNow
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "merchantdiff.github.io",
              "key": "ea135eb8f61d4600a04e289be17b8956",
              "keyLocation": "https://merchantdiff.github.io/merchantdiff-site/ea135eb8f61d4600a04e289be17b8956.txt",
              "urlList": [
                "https://merchantdiff.github.io/merchantdiff-site/updates.html"
              ]
            }' \
            https://api.indexnow.org/indexnow
